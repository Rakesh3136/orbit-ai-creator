name: daily-discovery

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'

concurrency:
  group: daily-discovery
  cancel-in-progress: false

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ORBIT
        run: python -m pip install -e '.[dev]'
      - name: Discover opportunities
        run: python -c "from orbit.automation import run_discovery; print(run_discovery())"
      - name: Upload discovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbit-daily-discovery
          path: data/discovery/ideas.json
