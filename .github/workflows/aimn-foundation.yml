name: aimn-foundation

on:
  push:
    branches: ["feature/aimn-foundation"]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".dockerignore"
      - "README.md"
      - ".github/workflows/aimn-foundation.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".dockerignore"
      - "README.md"
      - ".github/workflows/aimn-foundation.yml"

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |\n            pyproject.toml\n            apps/api/pyproject.toml
      - run: python -m pip install -e "../.." -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m compileall -q src

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package.json
      - run: npm install
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-postgres-password
      AIMN_OWNER_EMAIL: owner@example.test
      AIMN_OWNER_PASSWORD_HASH: ci-placeholder-hash
      AIMN_SESSION_SECRET: ci-only-secret-that-is-longer-than-32-characters
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t aimn-api:ci .
      - name: Build dashboard image
        run: docker build -f apps/web/Dockerfile --build-arg NEXT_PUBLIC_AIMN_API_URL=http://localhost:8000 -t aimn-web:ci .
