name: production-smoke

on:
  push:
  pull_request:

concurrency:
  group: production-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - name: Install ORBIT
        run: python -m pip install -e '.[dev]'
      - name: Verify media tools
        run: |
          ffmpeg -version | head -n 1
          espeak-ng --version
      - name: Render deterministic CI episode
        run: orbit --demo-video --narration silent --output data/smoke
      - name: Validate video, captions, and provenance
        run: |
          test -s data/smoke/orbit_demo.mp4
          test -s data/smoke/orbit_demo.srt
          test -s data/smoke/asset_provenance.json
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 data/smoke/orbit_demo.mp4
      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbit-demo-episode
          path: |
            data/smoke/orbit_demo.mp4
            data/smoke/orbit_demo.srt
            data/smoke/asset_provenance.json
            data/smoke/package/
