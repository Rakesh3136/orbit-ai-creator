[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "aimn-api"
version = "0.2.0"
description = "Autonomous AI Media Network API"
requires-python = ">=3.11"
dependencies = ["alembic>=1.14,<2.0", "cryptography>=43,<47", "fastapi>=0.115,<1.0", "pydantic>=2.10,<3.0", "sqlalchemy>=2.0,<3.0", "uvicorn[standard]>=0.30,<1.0"]
[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4.0"]
dev = ["httpx>=0.27", "pytest>=8.0"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
