[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-ai-creator"
version = "0.1.0"
description = "Local-first autonomous YouTube creator OS"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
orbit = "orbit.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
