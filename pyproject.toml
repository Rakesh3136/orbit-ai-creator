[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-ai-creator"
version = "0.3.0"
description = "Local-first autonomous YouTube creator OS"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
youtube = [
  "google-api-python-client>=2.150.0",
  "google-auth>=2.35.0",
  "google-auth-oauthlib>=1.2.1",
  "google-auth-httplib2>=0.2.0",
]

[project.scripts]
orbit = "orbit.main:main"
orbit-doctor = "orbit.doctor:main"
orbit-connect-youtube = "orbit.youtube.connect:main"

[tool.setuptools.packages.find]
include = ["orbit*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
