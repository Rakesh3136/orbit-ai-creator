services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aimn
      POSTGRES_USER: aimn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - aimn_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aimn -d aimn"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://aimn:${POSTGRES_PASSWORD}@postgres:5432/aimn
      AIMN_OWNER_EMAIL: ${AIMN_OWNER_EMAIL:?Set AIMN_OWNER_EMAIL in .env}
      AIMN_OWNER_PASSWORD_HASH: ${AIMN_OWNER_PASSWORD_HASH:?Generate password hash}
      AIMN_SESSION_SECRET: ${AIMN_SESSION_SECRET:?Set a random session secret}
      AIMN_SESSION_TTL_SECONDS: ${AIMN_SESSION_TTL_SECONDS:-43200}
      AIMN_SESSION_COOKIE_SECURE: ${AIMN_SESSION_COOKIE_SECURE:-false}
      AIMN_WEB_ORIGIN: ${AIMN_WEB_ORIGIN:-http://localhost:3000}
      AIMN_PRODUCTION_ROOT: /app/data/production
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "aimn_api.worker", "--poll-seconds", "3"]
    environment:
      DATABASE_URL: postgresql+psycopg://aimn:${POSTGRES_PASSWORD}@postgres:5432/aimn
      AIMN_PRODUCTION_ROOT: /app/data/production
      AIMN_LLM_PROVIDER: ${AIMN_LLM_PROVIDER:-none}
      AIMN_OLLAMA_URL: ${AIMN_OLLAMA_URL:-http://ollama:11434}
      AIMN_OLLAMA_MODEL: ${AIMN_OLLAMA_MODEL:-qwen2.5:3b}
    volumes:
      - ./data:/app/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        AIMN_INTERNAL_API_URL: http://api:8000
    ports:
      - "${AIMN_BIND_HOST:-0.0.0.0}:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    volumes:
      - aimn_ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  aimn_postgres_data:
  aimn_ollama_data:
